<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPMA PREVISÃO METEOROLÓGICA ATÉ 3 DIAS</title>

    <style>
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 32px;
            font-weight: 600;
            color: #0d47a1;
        }

        #cidadeSelect {
            display: block;
            margin: 0 auto 30px auto;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #90caf9;
            width: 260px;
            background: white;
        }

        .container {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .coluna {
            flex: 1;
            min-width: 280px;
            max-width: 350px;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .coluna:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.18);
        }

        .coluna h2 {
            text-align: center;
            margin-top: 0;
            font-size: 22px;
            color: #1565c0;
        }

        .icone {
            display: block;
            margin: 10px auto 20px auto;
            width: 90px;
        }

        .campo {
            margin-bottom: 12px;
            font-size: 16px;
            padding: 8px 12px;
            background: #f1f8ff;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h1>IPMA PREVISÃO METEOROLÓGICA ATÉ 3 DIAS</h1>

    <select id="cidadeSelect"></select>

    <div class="container">
        <div class="coluna" id="coluna1">
            <h2>Previsão 1º dia</h2>
            <img class="icone" id="icon1">
            <div class="conteudo"></div>
        </div>

        <div class="coluna" id="coluna2">
            <h2>Previsão 2º dia</h2>
            <img class="icone" id="icon2">
            <div class="conteudo"></div>
        </div>

        <div class="coluna" id="coluna3">
            <h2>Previsão 3º dia</h2>
            <img class="icone" id="icon3">
            <div class="conteudo"></div>
        </div>
    </div>

    <script>
        const api1 = "https://api.ipma.pt/open-data/forecast/meteorology/cities/daily/hp-daily-forecast-day0.json";
        const api2 = "https://api.ipma.pt/open-data/forecast/meteorology/cities/daily/hp-daily-forecast-day1.json";
        const api3 = "https://api.ipma.pt/open-data/forecast/meteorology/cities/daily/hp-daily-forecast-day2.json";

        const apiCidades = "https://api.ipma.pt/open-data/distrits-islands.json";

        const nomesCampos = {
            tMin: "Temperatura mínima (°C)",
            tMax: "Temperatura máxima (°C)",
            precipitaProb: "Probabilidade de precipitação (%)",
            predWindDir: "Direção do vento",
            classWindSpeed: "Intensidade do vento"
        };

        async function carregarCidades() {
            const resposta = await fetch(apiCidades);
            const dados = await resposta.json();

            const select = document.getElementById("cidadeSelect");
            select.innerHTML = "";

            dados.data.forEach(cidade => {
                const option = document.createElement("option");
                option.value = cidade.globalIdLocal;
                option.textContent = cidade.local;
                select.appendChild(option);
            });

            // Carregar previsão inicial
            atualizarPrevisao();
        }

        async function carregarDados(url, colunaId, iconId, cidadeID) {
            try {
                const resposta = await fetch(url);
                const dados = await resposta.json();

                const container = document.querySelector(`#${colunaId} .conteudo`);
                const iconImg = document.getElementById(iconId);

                container.innerHTML = "";

                const cidade = dados.data.find(item => item.globalIdLocal == cidadeID);

                if (!cidade) {
                    container.innerHTML = "Sem dados para esta cidade.";
                    return;
                }

                iconImg.src = `https://www.ipma.pt/resources.www/icons_svg/weather/w_ic_d_${cidade.idWeatherType}.svg`;

                const camposMostrar = ["tMin", "tMax", "precipitaProb", "predWindDir", "classWindSpeed"];

                camposMostrar.forEach(campo => {
                    const div = document.createElement("div");
                    div.className = "campo";
                    div.textContent = `${nomesCampos[campo]}: ${cidade[campo]}`;
                    container.appendChild(div);
                });

            } catch (erro) {
                document.querySelector(`#${colunaId} .conteudo`).innerHTML =
                    "Erro ao carregar dados.";
            }
        }

        function atualizarPrevisao() {
            const cidadeID = document.getElementById("cidadeSelect").value;

            carregarDados(api1, "coluna1", "icon1", cidadeID);
            carregarDados(api2, "coluna2", "icon2", cidadeID);
            carregarDados(api3, "coluna3", "icon3", cidadeID);
        }

        document.getElementById("cidadeSelect").addEventListener("change", atualizarPrevisao);

        carregarCidades();
    </script>

</body>
</html>
